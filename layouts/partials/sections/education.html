<p class="eyebrow">Background</p>
<h2 class="section-title" id="section-education">Education</h2>
<div class="education-list">
    {{ range hugo.Data.MAC.knowledge.studies }}
    <article class="education-item">
        <span class="education-icon" aria-hidden="true"><i class="mdi mdi-school-outline"></i></span>
        <div>
            <h3>{{ .name }}</h3>
            <a class="organization-link" href="{{ .institution.URL }}" target="_blank" rel="noopener noreferrer">{{ .institution.name }} <span class="ui-icon" aria-hidden="true"><i class="mdi mdi-arrow-top-right"></i></span></a>
            <p class="date-range"><time datetime="{{ .startDate }}">{{ time.Format "Jan 2006" .startDate }}</time><span aria-hidden="true">—</span>{{ if .finishDate }}<time datetime="{{ .finishDate }}">{{ time.Format "Jan 2006" .finishDate }}</time>{{ else }}<span>Present</span>{{ end }}</p>
        </div>
    </article>
    {{ end }}
</div>
